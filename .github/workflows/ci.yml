# CI: fmt, clippy, тесты, MSRV, аудит зависимостей, лицензии/баны/источники.
# Решения и отложенные пункты — docs/adr/ADR-005-ci-and-cli-tests.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# B4: минимум прав на уровне workflow — джобам CI запись в репозиторий не нужна.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Строгий режим (P2-4 закрыта 2026-08-17): pedantic-линты зачищены,
    # осознанные исключения — явный allow-список с обоснованием в Cargo.toml
    # [lints.clippy]. Новое предупреждение = красная сборка.
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Каркас `bootstrap` и догфуд-правило C-31 гоняют тесты шаблонов
      # (pytest) — без него шаблонная проверка честно пропускается, а
      # `--require-python` в CI этого не допускает (задание 0.3.5, E2).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install --quiet pytest
      - run: cargo test

  core-build:
    # Инверсия, шаг 4: слим-сборка «орган чужого CLI-агента» — core без
    # сетевых LLM-провайдеров (reqwest), TUI (ratatui/crossterm/arboard) и
    # веба (scraper). Гейт от протечки harness-стека в core; текстовый
    # tripwire на исходниках — правило C-29 в CONSTRAINTS.yaml.
    name: core build (--no-default-features --features core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install --quiet pytest
      - run: cargo check --no-default-features --features core
      - run: cargo test --no-default-features --features core

  hermetic:
    # A2 (0.3.7): тесты и каркас не зависят от установленного pytest.
    # Контейнер без python: исполняемые правила без прогонщика обязаны
    # честно пропускаться (SKIP с причиной, bootstrap → INCOMPLETE), тесты
    # без внешних зависимостей — зелёные, а реально требующие pytest —
    # guard «skipped: no pytest». Соседние джобы ставят pytest и прячут
    # регресс этой герметичности — здесь он ловится по построению.
    name: hermetic (no python)
    runs-on: ubuntu-latest
    container:
      # MSRV (Cargo.toml rust-version = "1.85"); slim — без python в базе.
      image: rust:1.85-slim-bookworm
    steps:
      # git нужен и checkout'у, и тестам (init/commit в песочницах); в
      # slim-образе его нет. Python git за собой не тянет — инвариант ниже.
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # rust-toolchain.toml пиннит stable — в контейнере rustup скачивал бы
      # второй toolchain поверх нужного 1.85; файл здесь не нужен.
      - run: rm rust-toolchain.toml
      # Инвариант джобы: python отсутствует по построению.
      - run: |
          echo "python3: $(command -v python3 || echo 'отсутствует')"
          echo "pytest: $(command -v pytest || echo 'отсутствует')"
          ! command -v python3 && ! command -v pytest
      - run: cargo test
      - run: cargo test --no-default-features --features core

  msrv:
    name: MSRV 1.85 (cargo check)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml пиннит stable и перекрывает дефолт rustup;
      # RUSTUP_TOOLCHAIN имеет приоритет над toolchain-файлом.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # rust-cache кэширует $CARGO_HOME/bin — cargo-audit собирается раз.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  deny:
    # B4 (0.3.12): лицензионная политика, баны и источники зависимостей —
    # машинная проверка вместо ручного `jq` по SBOM (docs/supply-chain.md).
    # Возврат к отложенному DEF-2 (ARCHITECTURE-SPINE.md): условие возврата —
    # «публикация бинарных артефактов» — наступило (release.yml).
    # Конфиг — deny.toml в корне; advisories остаются за джобой audit.
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # rust-cache кэширует $CARGO_HOME/bin — cargo-deny собирается раз.
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses bans sources

  supply-chain:
    # Поставка (ADR-031/T5, GEN-18): SBOM (CycloneDX) + хэши артефактов —
    # ДИТ сверяет поставку по docs/supply-chain.md, не доверяя бинарю на слово.
    # B2 (0.3.12): сборка — строго `--locked` (как релизная); релизный SBOM
    # теперь собирается в release.yml той же сборкой, что и публикуемые бинари,
    # а эта джоба остаётся проверкой собираемости и источником артефакта CI.
    name: supply chain (SBOM + SHA256SUMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-sbom --locked
      - run: cargo build --release --locked
      - run: cargo sbom --output-format cyclone_dx_json_1_6 > sbom.cyclonedx.json
      - run: |
          cd target/release && sha256sum arch-be > ../../SHA256SUMS.release && cd ../..
          sha256sum sbom.cyclonedx.json >> SHA256SUMS.release
          cat SHA256SUMS.release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: |
            sbom.cyclonedx.json
            SHA256SUMS.release
          retention-days: 90

  dogfood:
    # Догфудинг (AD-9 корневого ARCHITECTURE-SPINE.md): харнесс гейтит
    # собственный репозиторий своими же механиками — spine-линтер и
    # fitness-гейт по корневым ARCHITECTURE-SPINE.md / CONSTRAINTS.yaml.
    # Внутри fitness-гейта — cargo fmt --check и cargo test (C-18/C-19).
    name: dogfood (self spine + fitness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install --quiet pytest
      - run: cargo build
      - run: ./target/debug/arch-be control spine ARCHITECTURE-SPINE.md
      - run: ./target/debug/arch-be control check . --constraints CONSTRAINTS.yaml
      - name: personal paths scan
        # AD-7: персональные пути не живут в репозитории; допустимы только
        # плейсхолдеры /home/user/ (сцены скриншотов) и /home/.../ (доки).
        # Сам workflow исключён: в нём литерально записана эта команда.
        # NB: допускается и «голый» /home/user без слэша — TUI-сцены режут
        # путь по ширине панели (напр. «/home/user/sbp-gateway» → «/home/user»).
        run: |
          leaks=$(git grep -nI "/home/" -- . ":(exclude).github/workflows/ci.yml" | grep -vE "/home/(user([^/a-zA-Z0-9_.-]|$)|user/|\.\.\./)" || true)
          if [ -n "$leaks" ]; then echo "$leaks"; exit 1; fi
          echo "personal paths: чисто"

  selftest:
    # B3 (0.3.17): метаморфный самотест вердикта — отдельная джоба CI.
    # Поломка инварианта 8 (хук ищет подстроку `gate` вместо вызова шима
    # `arch-be hook stop`) жила с 0.3.13 четыре релиза незамеченной: самотест
    # вердикта сам выдавал неверный вердикт. Теперь прогон обязателен.
    name: selftest (metamorphic verdict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build
      - run: ./target/debug/arch-be selftest

  eval-suite:
    # Continuous evals конфигурации харнесса (docs/evals.md): встроенный сьют
    # agent-config прогоняется герметично (временный дом, офлайн, без ключей),
    # гейт pass-rate 100% — деградация конфигурации ломает сборку.
    name: eval suite (agent-config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build
      - run: ./target/debug/arch-be eval run
