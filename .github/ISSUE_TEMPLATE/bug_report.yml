name: Дефект (bug report)
description: Неверный вердикт гейта, падение, регрессия, ошибка сборки arch-be
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за репорт. Перед отправкой проверьте, что дефект
        воспроизводится на последней версии (`arch-be --version`).
        Уязвимости сюда не пишем — процедура в `SECURITY.md`.
  - type: input
    id: version
    attributes:
      label: Версия arch-be
      description: Вывод `arch-be --version`; для сборки из исходников — коммит
      placeholder: "arch-be 0.3.6"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS arm64
        - Windows x86_64
        - Другое (укажите в описании)
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Редакция
      description: Какая сборка затронута
      options:
        - Spine Harness (полная, фича harness)
        - Spine Core (--no-default-features --features core)
        - Обе
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Команды и входные данные; минимальный кейс приветствуется
      placeholder: |
        1. `arch-be control check . --constraints CONSTRAINTS.yaml`
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Вердикт, код возврата, текст ошибки
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: |
        Релевантный вывод (stderr, журнал). **Без секретов и персональных
        путей** — журналы проходят редактирование перед вставкой.
      render: text
    validations:
      required: false
