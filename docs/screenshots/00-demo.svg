<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,monospace">
