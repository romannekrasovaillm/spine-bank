# cargo-audit: политика подавлений (CI-джоба `audit`, ADR-005).
#
# RUSTSEC-2026-0367 / 0368 / 0369 — уязвимости zip 7.2.0 в API ИЗВЛЕЧЕНИЯ
# архивов (`ZipArchive::extract`, `ZipStreamReader::extract`): сохранение
# SUID/SGID и symlink-escape за пределы каталога распаковки. Spine использует
# zip только для создания и чтения архивов (`ZipWriter`,
# `ZipArchive::by_name`/`read`); `extract()` в коде отсутствует (проверено
# grep по репозиторию). Патч выпущен только в zip >= 9.0.0, который требует
# Rust 1.88, а MSRV проекта — 1.85 (правило C-03). Подавление согласовано
# владельцем 2026-10-17 и действует до перехода на Rust 1.88; если extract()
# появится в коде — записи удалить и обновить zip.
[advisories]
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
