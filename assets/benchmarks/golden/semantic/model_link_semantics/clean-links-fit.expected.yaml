# Чистое досье: решение ADR-001 (истина о кошельке — на платформе ЦР) ссылается
# на инвариант AD-001 и на три компонента, свойство которых оно меняет —
# CMP-002 (исход только по ответу платформы или сверке), CMP-004 (проекция
# остатка с меткой свежести и признаком derived), CMP-006 (разрешение UNKNOWN по
# выписке, без автоправки). Роль каждой цели объяснима из двух карточек;
# подмены имени/домена нет.
# link_role_fit — 4..5: каждая ссылка играет названную роль, цель узнаётся по
# своей карточке (вето 1..2 ставить не за что).
# contract_ends_match — 3..5: контрактных источников в досье нет (субъект —
# решение, контракта у него нет), критерий неразрешим по материалу.
# decision_relevance — 4..5: решение разбирает именно эти три компонента, называя
# меняемое свойство каждого, а не упоминая их вскользь.
# rule_invariant_fit — 3..5: verified_by у субъекта нет, карточек правил нет
# (у AD-001 правило C-001 в досье не попадает: правило тянется только по
# verified_by самого субъекта).
rubric: model_link_semantics
kind: clean
scores:
  link_role_fit: {min: 4, max: 5}
  contract_ends_match: {min: 3, max: 5}
  decision_relevance: {min: 4, max: 5}
  rule_invariant_fit: {min: 3, max: 5}
