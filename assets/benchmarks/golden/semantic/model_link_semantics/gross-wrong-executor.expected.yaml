# Дефект D6 в грубой форме: у оркестратора (CMP-002) роль ссылки перепутана —
# в depends_on подставлен CMP-008 (нотификации клиента), а в теле ему приписаны
# обмен с платформой ЦР, нормализация ответов, различение исходов и владение
# контуром ключей стыка; адаптер CMP-003 низведён до текстов уведомлений.
# Карточки это опровергают: CMP-008 зависит от журнала и не вызывает платформу,
# а CMP-003 объявлен единственной точкой обмена и владельцем контура ключей.
# link_role_fit — 1..2: названную роль цель играть не может, дефект блокирующий.
# contract_ends_match — 3..5: источников-контрактов в досье нет (субъект —
# компонент, а не интеграция), критерий неразрешим по материалу.
# decision_relevance — 3..5: решений (ADR) среди ссылок субъекта нет.
# rule_invariant_fit — 3..5: verified_by у субъекта нет, карточек правил нет.
rubric: model_link_semantics
kind: defective
scores:
  link_role_fit: {min: 1, max: 2}
  contract_ends_match: {min: 3, max: 5}
  decision_relevance: {min: 3, max: 5}
  rule_invariant_fit: {min: 3, max: 5}
