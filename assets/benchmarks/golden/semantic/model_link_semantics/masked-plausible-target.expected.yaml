# Замаскированный дефект D6: цель правдоподобна по имени роли, но не по смыслу.
# У сверки (CMP-006) в depends_on добавлен INT-002 (АБС и учётное ядро банка),
# а в теле учётное ядро объявлено источником истины о состоянии кошелька, от
# которого зависит окно сверки. Ссылка механически валидна, но направление
# обратное: INT-002 — потребитель результата сверки (отражение операций в учёте
# банка), и его собственная карточка прямо говорит «Не является источником
# истины о состоянии кошелька», а AD-001 относит истину к платформе ЦР.
# link_role_fit — 1..2: роль «зависимость для определения исхода» цель играть
# не может, дефект блокирующий (ищется только сопоставлением двух карточек).
# contract_ends_match — 3..5: контрактных источников в досье нет (субъект —
# компонент), критерий неразрешим по материалу.
# decision_relevance — 3..5: решений (ADR) среди ссылок субъекта нет.
# rule_invariant_fit — 3..5: verified_by у субъекта нет, карточек правил нет.
rubric: model_link_semantics
kind: defective
scores:
  link_role_fit: {min: 1, max: 2}
  contract_ends_match: {min: 3, max: 5}
  decision_relevance: {min: 3, max: 5}
  rule_invariant_fit: {min: 3, max: 5}
