# Трудный чистый случай: у адаптера (CMP-003) среди целей есть инварианты
# AD-001, AD-004 и компонент-тёзка по смыслу CMP-010 (криптоконтур и ключи),
# а в обратных ссылках субъекта стоят РЕШЕНИЯ ADR-004 и ADR-008 —
# с теми же названиями, что у инвариантов AD-004 и AD-008. Ловушка в том,
# чтобы не счесть это подменой сущности: ссылки ведут на инварианты (ad),
# решения фигурируют лишь как обратные ссылки, и роль каждой цели объяснима
# из двух карточек (адаптер применяет ключ стыка, материалом владеет CMP-010).
# link_role_fit — 4..5: каждая ссылка играет названную роль, подмены нет.
# contract_ends_match — 3..5: контрактных источников в досье нет.
# decision_relevance — 3..5: решений (ADR) среди ссылок субъекта нет.
# rule_invariant_fit — 3..5: verified_by у субъекта нет, карточек правил нет.
rubric: model_link_semantics
kind: clean
scores:
  link_role_fit: {min: 4, max: 5}
  contract_ends_match: {min: 3, max: 5}
  decision_relevance: {min: 3, max: 5}
  rule_invariant_fit: {min: 3, max: 5}
