# Дефект D6 на стыке «интеграция ↔ контракт»: у каналов уведомлений (INT-005)
# в поле contract подставлен чужой контракт — антифрод-скоринг переводов
# цифрового рубля. В теле это закреплено фразой про проверку до отправки
# поручения и решения pass/step_up/stop. Владелец контракта (антифрод-платформа
# банка, поручение, 2FA) не встречается на сторонах интеграции доставки
# уведомлений: подмена видна только из сопоставления карточки и очерка контракта.
# link_role_fit — 1..2: названная цель не может играть роль контракта этого
# стыка, дефект блокирующий.
# contract_ends_match — 1..2: контракт описывает других участников и другую
# предметную область (скоринг переводов, а не доставку сообщений).
# decision_relevance — 3..5: решений (ADR) среди ссылок субъекта нет.
# rule_invariant_fit — 3..5: verified_by у субъекта нет, карточек правил нет.
rubric: model_link_semantics
kind: defective
scores:
  link_role_fit: {min: 1, max: 2}
  contract_ends_match: {min: 1, max: 2}
  decision_relevance: {min: 3, max: 5}
  rule_invariant_fit: {min: 3, max: 5}
