# Чистое досье: инвариант AD-005 (обязательное состояние UNKNOWN) проверяется
# правилом C-005 — в спецификации машины состояний обязано присутствовать
# UNKNOWN. Правило тянется по verified_by самого субъекта, поэтому в досье
# попадает карточка C-005, а её предмет (набор файлов
# docs/spec/operation-state-machine.md, шаблон UNKNOWN) совпадает с тем, что
# обещает формулировка инварианта. Ссылки ведут на компоненты, которым
# инвариант адресован и которые действительно его реализуют (оркестратор,
# журнал, сверка, возвраты); подмены имени/домена нет.
# link_role_fit — 4..5: каждая ссылка играет роль из своей карточки.
# contract_ends_match — 3..5: контрактных источников нет (субъект — инвариант,
# контракта у него нет), критерий неразрешим по материалу.
# decision_relevance — 3..5: решений (ADR) среди ссылок субъекта нет.
# rule_invariant_fit — 4..5: карточка правила C-005 есть и прямо покрывает
# проверяемое свойство инварианта.
rubric: model_link_semantics
kind: clean
scores:
  link_role_fit: {min: 4, max: 5}
  contract_ends_match: {min: 3, max: 5}
  decision_relevance: {min: 3, max: 5}
  rule_invariant_fit: {min: 4, max: 5}
