# Эталонные оценки golden-досье clean-enforced-by-construction.md (рубрика code_invariant_conformance).
# Нарушений не засеяно: субъект — хранилище журнала, где append-only и запрет ПДн
# обеспечены конструкцией, а не соглашением. Методов правки и удаления строки у
# хранилища нет вовсе (только `_INSERT`), исправление — компенсирующая запись
# со ссылкой на исходную, `record` отвергает поля вне перечня, а дедупликация
# `apply_once` держится на транзакции вокруг проверки и эффекта. Улика чистоты —
# перечень проверенных инвариантов, а не отсутствие ярлыка «нарушение».
rubric: code_invariant_conformance
kind: clean
scores:
  no_violation: {min: 4, max: 5}
  invariant_enforced: {min: 4, max: 5}
  bypass_paths: {min: 4, max: 5}
