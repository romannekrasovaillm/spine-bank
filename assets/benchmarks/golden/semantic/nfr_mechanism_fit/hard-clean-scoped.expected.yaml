# Эталонные оценки golden-досье hard-clean-scoped.md (рубрика nfr_mechanism_fit).
# Трудный чистый случай: показатель заявлен на часть контура (только путь
# приёма: INT-002 + CMP-001), что выглядит как сужение объёма, но объём
# совпадает — решение ADR-002 намеренно разводит приём и отправку, ответ
# источнику выдаётся до постановки поручений в очередь, поэтому ожидание
# платформы на подтверждение приёма не влияет. Бюджет сходится по числам:
# 600 + 500 + 400 = 1500 мс при цели p99 2000 мс, запас 500 мс на пиковый
# реестр зарплатного дня. Промах виден и описан.
rubric: nfr_mechanism_fit
kind: clean
scores:
  # Механизм даёт показатель по построению: из цитат видно, что подтверждение
  # выдаётся до отправки, а бюджет приёма посчитан по шагам с запасом.
  mechanism_sufficient: {min: 4, max: 5}
  # Объём совпадает, хотя и выглядит суженным: показатель заявлен ровно на те
  # шаги, которые проходят строки до ответа источнику, — тот же компонент, те
  # же данные, тот же режим отказа; отправка исключена явно и обоснованно.
  scope_match: {min: 4, max: 5}
  # Проверка измеряет именно этот показатель: гистограмма подтверждений приёма
  # даёт долю свыше 2000 мс, то есть число и режим отказа.
  verification_real: {min: 4, max: 5}
  # Названы режим при промахе (окно не продлевается, остаток реестра идёт
  # следующим окном, строки не теряются) и признак — доля подтверждений свыше
  # цели в отчёте недели; жёсткой границы и порога остановки нет, поэтому
  # верхняя оценка не гарантирована.
  degradation_defined: {min: 3, max: 5}
