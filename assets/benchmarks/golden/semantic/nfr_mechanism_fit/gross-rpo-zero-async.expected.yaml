# Эталонные оценки golden-досье gross-rpo-zero-async.md (рубрика nfr_mechanism_fit).
# Засеяно грубое расхождение показателя с механизмом: субъект — NFR-004, где
# заявлен RPO 0 «по построению» (подтверждение приёма только после надёжной
# фиксации записи), а привязанное решение ADR-002 выбирает асинхронную
# репликацию журнала: подтверждение выдаётся после фиксации на ведущем узле,
# ведомые догоняют в фоне. Числа в досье позволяют посчитать недостижимость:
# задержка репликации p99 12 секунд при пике 400 строк в секунду — это до
# 4800 подтверждённых, но существующих в одном экземпляре строк, то есть
# секунды потерь против обещанного нуля. Обе стороны спора видны цитатами:
# и обещание, и конструкция механизма.
rubric: nfr_mechanism_fit
kind: defective
scores:
  # Механизм несовместим с показателем по построению: асинхронная репликация
  # не даёт RPO 0, и цена решения прямо названа самим ADR. Только нижние
  # якоря — цитаты обеих сторон в досье есть.
  mechanism_sufficient: {min: 1, max: 2}
  # Объём совпадает: и показатель, и механизм — про журнал выплат целиком,
  # режим отказа тот же (потеря узла журнала).
  scope_match: {min: 4, max: 5}
  # Проверка — учения по восстановлению журнала: они касаются показателя, но
  # числа потерянных строк не требуют и режим отказа (отказ ведущего в момент
  # подтверждения) не воспроизводят.
  verification_real: {min: 2, max: 3}
  # Поведение при промахе не описано: метрика задержки репликации пишется,
  # но порога, границы и владельца у неё нет, и промах никого не останавливает.
  degradation_defined: {min: 1, max: 3}
