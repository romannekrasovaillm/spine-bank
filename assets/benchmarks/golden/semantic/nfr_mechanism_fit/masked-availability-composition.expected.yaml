# Эталонные оценки golden-досье masked-availability-composition.md (рубрика nfr_mechanism_fit).
# Засеяно замаскированное расхождение: показатель NFR-002 обещает 0.9999 на весь
# путь приёма, решение ADR-006 набирает четыре девятки репликами участков, и
# числа в карточках выглядят солидно — но не складываются. Хранилище реестров
# (CMP-006) стоит на пути приёма последовательно и имеет один узел с
# доступностью 0.999 без автоматического переключения, а оно — общий множитель
# произведения: 0.99999975 (две реплики по 0.9995) × 0.999999999 (три по 0.999)
# × 0.999 ≈ 0.99899, то есть три девятки, а не четыре. Проверка и поведение при
# промахе в досье описаны хорошо — дефект ровно один: механизм не даёт числа.
rubric: nfr_mechanism_fit
kind: defective
scores:
  # Механизм несовместим с показателем по построению: последовательная
  # зависимость с доступностью узла 0.999 ограничивает контур сверху, и
  # заявленные 0.9999 недостижимы при любом числе реплик остальных участков.
  mechanism_sufficient: {min: 1, max: 2}
  # Объём совпадает: показатель заявлен на весь путь приёма, резервирование
  # названо для тех же трёх участков и того же режима отказа.
  scope_match: {min: 4, max: 5}
  # Проверка измеряет сам показатель: SLI подтверждений по окнам, месячный
  # отчёт, разбор каждого отказа узла — то есть режим отказа покрыт.
  verification_real: {min: 4, max: 5}
  # Поведение при невыполнении описано: окно признаётся сорванным, источник
  # уведомляется, разбор с владельцем, признак — строка в отчёте окна.
  degradation_defined: {min: 4, max: 5}
