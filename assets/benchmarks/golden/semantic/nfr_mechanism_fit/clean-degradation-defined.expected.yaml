# Эталонные оценки golden-досье clean-degradation-defined.md (рубрика nfr_mechanism_fit).
# Ничего не засеяно: механизм достаточен, объём совпадает, поведение при
# невыполнении описано. Субъект — NFR-003 с пиком 400 строк в секунду, решение
# ADR-007 набирает ёмкость экземплярами и держит запас не меньше полутора:
# оркестратор 4 × 250 = 1000 строк в секунду (запас 2.5), адаптер 4 × 150 = 600
# (запас 1.5), запас сохраняется и при отказе одного экземпляра. Промах виден:
# глубина очереди пишется метрикой, предупреждение владельцу при 80% предела,
# остановка приёма и уведомление источника при 100%, потерь строк нет.
rubric: nfr_mechanism_fit
kind: clean
scores:
  # Механизм даёт показатель по построению: из цитат видно, за счёт чего именно —
  # экземпляры с запасом и обратное давление вместо потери строк.
  mechanism_sufficient: {min: 4, max: 5}
  # Объём совпадает: показатель заявлен на участки, пропускающие строки до
  # закрытия окна, и запас посчитан ровно по этим двум компонентам.
  scope_match: {min: 4, max: 5}
  # Проверка измеряет показатель: нагрузочный профиль окна даёт число (400 строк
  # в секунду тридцать минут) и покрывает режим отказа — отказ экземпляра.
  verification_real: {min: 4, max: 5}
  # Названы и режим деградации (обратное давление, продление окна, перенос строк
  # в следующее окно), и признак промаха с границей (orders_queue_depth, 80%/100%).
  degradation_defined: {min: 4, max: 5}
