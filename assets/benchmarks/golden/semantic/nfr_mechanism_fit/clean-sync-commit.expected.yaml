# Эталонные оценки golden-досье clean-sync-commit.md (рубрика nfr_mechanism_fit).
# Ничего не засеяно: механизм даёт заявленный показатель по построению.
# Субъект — NFR-004 с RPO 0 и RTO 30 минут, привязанное решение ADR-004
# подтверждает запись кворумом двух узлов из трёх до ответа источнику, отсюда
# ноль потерь следует прямо из конструкции, а не из обещания. Цена решения
# измерена (40 мс при бюджете 2000 мс), режим отказа назван (потеря ведущего —
# переизбрание за 2 минуты), учения дают числа (18 минут при RTO 30, ноль
# потерянных строк), признак промаха при недоступности кворума тоже назван.
rubric: nfr_mechanism_fit
kind: clean
scores:
  # Механизм даёт показатель по построению: подтверждённая строка есть минимум
  # на двух узлах из трёх, и это видно из цитат обеих сторон.
  mechanism_sufficient: {min: 4, max: 5}
  # Объём совпадает: показатель и механизм — про журнал выплат целиком, тот же
  # компонент, те же данные, тот же режим отказа (потеря узла журнала).
  scope_match: {min: 4, max: 5}
  # Проверка измеряет именно этот показатель: учения считают число потерянных
  # строк и время продолжения окна, то есть дают число и покрывают режим отказа.
  verification_real: {min: 4, max: 5}
  # Названы и режим деградации (приём приостанавливается, окно продлевается),
  # и признак промаха (journal_quorum_unavailable, запись в отчёте окна).
  degradation_defined: {min: 4, max: 5}
