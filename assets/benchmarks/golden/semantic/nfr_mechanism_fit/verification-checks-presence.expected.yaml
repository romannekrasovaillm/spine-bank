# Эталонные оценки golden-досье verification-checks-presence.md (рубрика nfr_mechanism_fit).
# Засеян дефект, который виден только при сличении поля «Проверка» с
# формулировкой показателя: механизм правдоподобен (ADR-004 — синхронный
# коммит в кворум двух узлов из трёх, цена 40 мс при бюджете 2000 мс, то есть
# RPO 0 достигается по построению), а способ проверки измеряет не значение
# показателя, а наличие строки: сверяется карточка компонента с эталонным
# перечнем режимов, и достаточно присутствия значения «синхронный коммит в
# кворум». Ноль потерянных строк такой сверкой не измеряется, режим отказа
# (недоступность кворума) не воспроизводится.
rubric: nfr_mechanism_fit
kind: defective
scores:
  # Механизм сам по себе способен дать RPO 0, но держится на неоговорённом
  # условии: узел, выпавший из кворума, чем дальше, тем вероятнее оставляет
  # контур без двух узлов из трёх, а что тогда происходит с окном — решением
  # не сказано. Верхний якорь недостижим, нижний — тем более.
  mechanism_sufficient: {min: 2, max: 3}
  # Объём совпадает: показатель и механизм — про журнал выплат целиком, тот
  # же компонент, те же данные, тот же режим отказа.
  scope_match: {min: 4, max: 5}
  # Проверка измеряет наличие артефакта (строки режима в карточке), а не
  # значение показателя: числа потерянных строк она не даёт вовсе.
  verification_real: {min: 1, max: 2}
  # Режим деградации назван (при недоступности кворума приём приостанавливается),
  # но границы нет и признака, по которому промах становится виден, тоже нет.
  degradation_defined: {min: 3, max: 4}
