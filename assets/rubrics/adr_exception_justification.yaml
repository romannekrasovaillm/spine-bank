# Смысловая рубрика (E10.2, волна 0.3.9): обоснованность исключения из
# инварианта. Досье: adr_vs_spine (субъект — ADR, ссылки — инварианты AD-n).
# Класс находки: решение объявляет отступление, но не называет, от чего
# отступает, почему, на какой срок и кто это принял. Молчаливое исключение
# опаснее названного: реестр ADR заводит его как обычное решение, а слой
# теряет инвариант. Механика этого не видит — судит судья, а реестр
# (`arch-be control adr-registry`) не пускает исключение без отчёта `pass`.
name: adr_exception_justification
description: "Обоснованность исключения: отступление от инварианта названо, объяснено, ограничено сроком и уровнем принятия"
scale_max: 5
origin: anchor
pack: adr_vs_spine
criteria:
  - id: exception_justified
    name: Исключение обосновано
    blocking: true
    description: >
      Если решение отступает от инварианта, обоснование проверяемо: назван
      обойдённый инвариант, причина отступления (техническая, продуктовая,
      регуляторная), уровень принятия решения и срок или условие пересмотра.
      Отступление «по умолчанию», без этих четырёх частей, обоснованием не
      является — даже если звучит убедительно.
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    coverage: reference_ids
    anchors:
      1: "Отступление есть, обоснования нет: не названы ни инвариант, ни причина, ни срок, ни уровень решения"
      3: "Обоснование частичное: причина названа, но нет срока/условия пересмотра либо уровня принятия"
      5: "Обоснование полное: названы обойдённый инвариант, причина, уровень принятия и условие пересмотра"
  - id: exception_scope
    name: Границы исключения узкие
    description: >
      Исключение ограничено тем, ради чего сделано: названо, что именно
      перестаёт действовать (какой инвариант, в каком сценарии, для какого
      компонента), и что продолжает действовать. Исключение «в целом» одной
      формулировкой снимает инвариант со всей системы.
    weight: 2
    anchors:
      1: "Исключение сформулировано широко: инвариант снят без границ («допускаем отступление»)"
      3: "Границы названы по компоненту, но не по сценарию, или наоборот"
      5: "Границы точны: видно, где инвариант перестаёт действовать и где продолжает"
  - id: exception_traceable
    name: Исключение видно в реестре
    description: >
      Исключение оставляет след, по которому его найдёт ревизия: ссылка на
      решение, которое его приняло (комитет, тикет, ADR-предшественник), и
      запись в самом документе, а не только в переписке.
    weight: 2
    anchors:
      1: "Следа нет: отступление неотличимо от обычного решения"
      3: "Ссылка на решение есть, но не назван уровень принятия"
      5: "След полный: названо решение и уровень, принявший исключение"
