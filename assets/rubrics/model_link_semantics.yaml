# Смысловая рубрика (ADR-051, волна B 0.3.5) — класс дефекта D6 red-team:
# ссылка ведёт «не на ту» сущность. Ссылка валидна механически (id существует,
# тип допустим), но роль цели ей не соответствует: платёжная операция
# ссылается на компонент уведомлений как на исполнителя.
# Досье: entity_links (субъект — карточка сущности, ссылки — карточки всех
# целей её связей, карточки правил fitness-реестра и очерк контракта для INT).
name: model_link_semantics
description: "Смысл связей модели: соответствует ли ответственность сущности-цели роли, в которой она названа"
scale_max: 5
origin: anchor
pack: entity_links
criteria:
  - id: link_role_fit
    name: Роль цели соответствует ответственности
    blocking: true
    description: >
      Ответственность сущности-цели соответствует роли, в которой она названа:
      исполнитель умеет то, что от него требуется ссылкой; зависимость — то, без
      чего работа невозможна. Доказательство — из ДВУХ карточек: чему ссылка
      приписывает цель и что цель по своему описанию делает.
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    anchors:
      1: "Цель по своему описанию не может играть названную роль — ответственности расходятся; в цитатах видно и приписанную роль, и описание цели"
      3: "Роль цели под вопросом: описание допускает её, но не подтверждает — например, назван исполнителем компонент, который по карточке лишь передаёт данные"
      5: "Каждая ссылка объяснима из двух карточек: у цели есть и полномочие, и предметная область для этой роли"
  - id: contract_ends_match
    name: Стороны контракта совпадают с ролями
    description: >
      Для интеграции: поставщик и потребитель из карточки совпадают со сторонами
      контракта, а операции контракта — по теме интеграции (в контракте нет
      чужой предметной области).
    weight: 2
    anchors:
      1: "Контракт описывает другую предметную область или других участников: названные стороны в нём не встречаются"
      3: "Контракт в целом тот, но состав операций шире темы интеграции либо сторона названа неявно"
      5: "Стороны и операции контракта совпадают с ролями карточки; лишних операций нет"
  - id: decision_relevance
    name: Решение говорит об этом компоненте
    description: >
      Для связей решения с компонентами: текст решения действительно об этом
      компоненте, а не о соседнем с похожим названием или о компоненте того же
      класса в другом контуре.
    weight: 2
    anchors:
      1: "Решение описывает другой компонент: названное в нём не совпадает с предметом карточки цели"
      3: "Решение упоминает цель вскользь, в общем перечислении, — связи как основания решения нет"
      5: "Решение разбирает именно эту цель: из текста видно, какое её свойство оно меняет"
  - id: rule_invariant_fit
    name: Проверка правила относится к инварианту
    description: >
      Для связей с правилами fitness-реестра: то, что правило проверяет (набор
      файлов, шаблон, команда), относится к формулировке инварианта, а не к
      соседней теме — иначе связь создаёт видимость покрытия.
    weight: 1
    anchors:
      1: "Проверка правила про другое: шаблон или команда не касаются того, что утверждает инвариант"
      3: "Проверка относится к теме, но не к формулировке: ловит произвольное упоминание, а не нарушение"
      5: "Шаблон и набор файлов проверяют именно то, что запрещает или требует инвариант"
