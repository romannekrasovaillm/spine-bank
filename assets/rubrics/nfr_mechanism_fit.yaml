# Смысловая рубрика (ADR-051, волна B 0.3.5) — класс, которого нет среди
# мутаторов red-team, но который вскрыл кейс «Кошелёк ЦР физлица»: правило
# rto_rpo_backed_by_adr проверяет, что у показателя есть решение-механизм, но
# не то, что механизм способен дать обещанное число. «RPO 0 при асинхронной
# репликации» проходило зелёным.
# Досье: nfr_mechanism (субъект — карточка NFR, ссылки — ADR и компоненты,
# привязанные трассировкой в обе стороны).
name: nfr_mechanism_fit
description: "Обещание показателя против механизма: способен ли привязанный решением механизм дать заявленное число"
scale_max: 5
origin: anchor
pack: nfr_mechanism
criteria:
  - id: mechanism_sufficient
    name: Механизм достаточен для показателя
    blocking: true
    description: >
      Механизм, выбранный решением, способен дать заявленный показатель.
      Оценивается по существу конструкции, а не по названию: асинхронная
      репликация не даёт RPO 0; доступность участка не выше, чем у его
      последовательной зависимости; число реплик без балансировщика не даёт
      доступность.
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    anchors:
      1: "Механизм несовместим с показателем по построению — заявленное число недостижимо; в цитатах видны и показатель, и конструкция механизма"
      3: "Механизм может дать показатель лишь при неоговорённых условиях (нет запаса по ёмкости, нет описания режима отказа) — то есть обещание не гарантировано"
      5: "Механизм даёт заявленный показатель по построению: из цитат видно, за счёт чего именно"
  - id: scope_match
    name: Объём механизма совпадает с показателем
    description: >
      Механизм покрывает тот же объём, что и показатель: тот же компонент, те
      же данные, тот же режим отказа. Показатель на весь контур, обеспеченный
      одним звеном, — обещание шире механизма.
    weight: 2
    anchors:
      1: "Механизм относится к другому объёму: другой компонент, другой поток данных или другой режим отказа"
      3: "Объём совпадает лишь частично: механизм назван для части контура, а показатель заявлен на весь"
      5: "Объём совпадает: из текста видно, что механизм накрывает ровно те компоненты, данные и режим, которых касается показатель"
  - id: verification_real
    name: Способ проверки измеряет показатель
    description: >
      Заявленный способ проверки действительно измеряет этот показатель, а не
      смежный: наличие решения не измеряет доступность, а присутствие слова
      «репликация» — потерю данных.
    weight: 2
    anchors:
      1: "Проверка измеряет не то: проверяется наличие артефакта или слова, а не значение показателя"
      3: "Проверка касается показателя, но не даёт числа или не покрывает режим отказа, в котором показатель важен"
      5: "Проверка измеряет именно этот показатель в том же объёме, с числом и режимом отказа"
  - id: degradation_defined
    name: Описано поведение при невыполнении
    description: >
      Описано, что происходит, когда показатель не выполняется: деградация,
      отказ, компенсация. Показатель без поведения при промахе — пожелание.
    weight: 1
    anchors:
      1: "Поведение при невыполнении не описано; из текста следует, что промах останется незамеченным"
      3: "Поведение названо общими словами («деградируем»), без границы и без того, кто узнаёт о промахе"
      5: "Названы и режим деградации, и признак, по которому промах становится виден"
