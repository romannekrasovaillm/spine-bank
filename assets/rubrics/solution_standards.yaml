# Смысловая рубрика слоя ДКА (E10.1, волна 0.3.9): солюшен-документ против
# стандартов корпоративного слоя. Досье: solution_vs_standards (субъект —
# документ решения, ссылки — стандарты `docs/standards/**`). Механика этот
# класс не ловит: стандарт говорит «как принято на слое», документ — «как
# решено здесь», а расхождение видно только по смыслу. Нарушение обязано быть
# названо с обеими цитатами: утверждение документа и пункт стандарта.
name: solution_standards
description: "Соответствие солюшен-документа стандартам слоя ДКА: нет утверждения, противоречащего стандарту, а каждое отступление оформлено и обосновано"
scale_max: 5
origin: anchor
pack: solution_vs_standards
criteria:
  - id: standard_compliance
    name: Нет противоречия стандарту слоя
    blocking: true
    description: >
      Ни одно утверждение документа — включая разделы интеграций, данных,
      отказоустойчивости и «дополнительно» — не разрешает того, что запрещает
      стандарт слоя, и не опирается на механизм, который стандарт исключил.
      Совпадение слов не спасает: если следствие утверждения расходится со
      стандартом, это противоречие, и оно называется с обеими цитатами —
      утверждением документа и пунктом стандарта.
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    coverage: reference_ids
    anchors:
      1: "Прямое противоречие: названы утверждение документа и пункт стандарта, который оно нарушает"
      3: "Расхождение возможно: формулировка допускает прочтение, расходящееся со стандартом, либо стандарт назван формально, без проекции на решение"
      5: "Противоречий нет: перечислены все проверенные стандарты досье, и ни один не задет"
  - id: deviation_discipline
    name: Отступление оформлено и обосновано
    description: >
      Если документ отступает от стандарта, отступление названо явно: какой
      пункт обойдён, почему (техническая причина, срок, ограничение
      продукта) и кто это принял. Молчаливое отступление хуже названного: его
      не видит ни ревьюер, ни комитет, и слой ДКА теряет единообразие.
    weight: 2
    evidence_on: low
    evidence_roles: [subject, reference]
    anchors:
      1: "Отступление не названо вовсе, хотя решение расходится со стандартом"
      3: "Отступление названо, но без причины или без уровня принятия решения"
      5: "Каждое отступление названо, обосновано и подкреплено ссылкой на стандарт, от которого отступают"
  - id: layer_scope
    name: Соблюдены границы слоя ДКА
    description: >
      Решение остаётся в границах слоя: не забирает себе функции соседнего слоя
      (платформы, продукта, инфраструктуры) и не требует того, что стандарт
      слоя запрещает требовать. Это оценивается по документу: названы ли
      смежные слои и их ответственность.
    weight: 2
    anchors:
      1: "Границы слоя размыты: документ забирает ответственность соседнего слоя или требует запрещённого"
      3: "Границы названы частично: смежные слои упомянуты, но ответственность не разделена"
      5: "Границы точны: видно, что делает решение, что остаётся соседним слоям, и стандарт это допускает"
