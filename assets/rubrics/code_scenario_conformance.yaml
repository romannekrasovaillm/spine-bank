# Смысловая рубрика (E11.1, волна 0.3.9): код против сценариев проверки из
# OpenSpec. Досье: code_vs_scenarios (субъект — файл кода, ссылки — сценарии
# WHEN/THEN, каждый со своим идентификатором `openspec:<capability>#<hash>/S<n>`).
# Вывод живой руки B: структурированная инструкция «требование + сценарий» даёт
# точность не хуже, чем оценка требования целиком, потому что судье не нужно
# самому придумывать, что проверять. Сценариев в досье может быть много, и
# каждый оценивается поимённо: критерий с покрытием требует перечислить все
# проверенные идентификаторы сценариев, иначе решение уходит человеку.
name: code_scenario_conformance
description: "Соответствие кода сценариям проверки OpenSpec: каждый сценарий (WHEN/THEN) проверен поимённо, нарушение названо с цитатами кода и сценария"
scale_max: 5
origin: anchor
pack: code_vs_scenarios
criteria:
  - id: scenario_conformance
    name: Код соответствует сценариям проверки
    blocking: true
    description: >
      Для каждого сценария досье видно, выполняется ли он кодом. Нарушение —
      утверждение, что сценарий не выполняется, — называется с обеими
      цитатами: строкой кода и шагом сценария (WHEN/THEN). Проверенными
      считаются только те сценарии, чьи идентификаторы перечислены: сценарий,
      о котором судья промолчал, проверенным не считается.
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    coverage: reference_ids
    anchors:
      1: "Сценарий нарушен: названы строка кода и шаг сценария, который она нарушает"
      3: "Сценарий выполняется частично: один из шагов WHEN/THEN не покрыт кодом, либо покрыт косвенно"
      5: "Все сценарии досье проверены поимённо, и ни один не нарушен"
  - id: scenario_trace
    name: Нарушение привязано к требованию
    description: >
      Если сценарий нарушен, видно, какое требование за ним стоит: названо
      требование OpenSpec (строки SHALL/MUST), а не только шаг сценария.
      Нарушение сценария без требования читается как придирка к тесту.
    weight: 2
    anchors:
      1: "Требование не названо: видно только расхождение со сценарием"
      3: "Требование названо формально, без проекции на код"
      5: "Видно, какое требование нарушено и почему это следует из кода"
  - id: scenario_boundaries
    name: Проверены границы сценария
    description: >
      Оценивается не только «счастливый путь» сценария, но и его границы:
      пустой вход, повтор, ошибка внешнего вызова, отказ. Сценарий,
      проверенный только по основному пути, даёт частичный балл: код может
      нарушать инвариант именно на границе.
    weight: 2
    anchors:
      1: "Границы не проверены: сценарий прочитан как основной путь"
      3: "Часть границ названа, часть — нет"
      5: "Границы сценария проверены: названы условия, при которых он перестаёт выполняться"
