# Смысловая рубрика (ADR-051, волна B 0.3.5) — класс дефекта D10 red-team:
# решение противоречит инварианту спайна, при том что «слова на месте».
# Досье: adr_vs_spine (субъект — ADR, ссылки — инварианты AD-n и отложенные
# решения DEF-n). Механика этого класса не ловит по построению: правило видит
# форму, а несовместимость двух утверждений — смысл.
name: adr_spine_consistency
description: "Согласованность решения с инвариантами спайна: нет ли утверждения или следствия, разрешающего то, что инвариант запрещает"
scale_max: 5
origin: anchor
pack: adr_vs_spine
criteria:
  - id: no_contradiction
    name: Нет противоречия инварианту
    blocking: true
    description: >
      Ни одно утверждение решения — включая разделы последствий, митигаций и
      «дополнительно» — не разрешает того, что инвариант запрещает, и не
      опирается на исключённый им механизм. Совпадение слов не спасает: если
      следствие утверждения нарушает инвариант, это противоречие.
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    coverage: reference_ids
    anchors:
      1: "Прямое противоречие: в решении есть утверждение, разрешающее запрещённое, — названы и утверждение, и инвариант, который оно нарушает"
      3: "Формулировка допускает нарушающее прочтение: исполнитель может отступить от инварианта, не заметив этого; либо совпадающие слова прикрывают расходящийся смысл"
      5: "Противоречий нет: перечислены все проверенные инварианты досье, и ни один не задет"
  - id: invariant_attribution
    name: Названы задетые инварианты
    description: >
      Решение называет инварианты, которые оно действительно задевает.
      Отсутствие упоминания — не цитата, поэтому доказательство здесь требуется
      за высокий балл: точный перечень виден в тексте.
    weight: 2
    anchors:
      1: "Задетый инвариант не упомянут вовсе"
      3: "Инварианты названы неполно или формально («соблюдаем все требования»), без указания, какой именно ограничивает решение"
      5: "Перечень точен: названы именно задетые инварианты, и видно, чем решение их касается"
  - id: exception_discipline
    name: Отступление оформлено явно
    description: >
      Если решение отступает от инварианта, отступление оформлено: назван сам
      факт отступления, срок или условие пересмотра и уровень принятия решения.
      Молчаливое отступление хуже названного: его не видит ни ревьюер, ни гейт.
    weight: 2
    evidence_on: low
    evidence_roles: [subject, reference]
    anchors:
      1: "Отступление молчаливое: решение поступает против инварианта, не называя этого — названы и утверждение-отступление, и инвариант"
      3: "Отступление названо, но без срока, условия пересмотра или уровня решения — договориться о нём задним числом нечем"
      5: "Отступлений нет либо каждое оформлено: названо, чем ограничено по времени, при каком условии пересматривается и кто решил"
  - id: deferred_respected
    name: Отложенное не решено молча
    description: >
      Спайн сознательно отложил часть решений (секция Deferred) — до условия
      возврата их не принимают. Решение молча закрывающее отложенный вопрос —
      не прогресс, а обход зафиксированной договорённости.
    weight: 1
    evidence_on: low
    evidence_roles: [subject, reference]
    anchors:
      1: "Решение принимает отложенный вопрос как решённый, не упоминая ни самого отложения, ни условия возврата"
      3: "Отложенный вопрос затронут косвенно: решение опирается на его исход, не называя этого"
      5: "Отложенные решения не затронуты; если затронуты — названо условие возврата и показано, что оно выполнено"
