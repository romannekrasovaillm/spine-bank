# Смысловая рубрика (ADR-051, волна B 0.3.5) — класс дефекта D11 red-team:
# код нарушает инвариант, а правила на этот код нет (правило ловит текст, а не
# конструкцию). Досье: code_vs_spine (субъект — файл или фрагмент кода,
# ссылки — инварианты AD-n и отложенные решения DEF-n). Большой файл приходит
# нарезанным на фрагменты: каждый фрагмент — свой субъект и свой отчёт.
name: code_invariant_conformance
description: "Соответствие кода инвариантам спайна: нет ли конструкции, нарушающей инвариант, и нет ли обходного пути мимо защиты"
scale_max: 5
origin: anchor
pack: code_vs_spine
criteria:
  - id: no_violation
    name: Нет конструкции, нарушающей инвариант
    blocking: true
    description: >
      В коде нет конструкции, нарушающей инвариант: не только прямого вызова
      запрещённого, но и обхода защиты, и режима, в котором инвариант перестаёт
      соблюдаться (отладочная ветка, «временный» флаг, тихий фолбэк).
    weight: 3
    evidence_on: low
    evidence_roles: [subject, reference]
    coverage: reference_ids
    anchors:
      1: "Прямое нарушение: названы и строка кода, и инвариант, который она нарушает"
      3: "Нарушение возможно, но не безусловно: конструкция допускает режим, в котором инвариант перестаёт соблюдаться, либо защита обойдена косвенно"
      5: "Нарушений нет: перечислены все проверенные инварианты досье, и ни один не задет"
  - id: invariant_enforced
    name: Соблюдение видно в коде, а не в комментарии
    description: >
      Там, где код затрагивает область инварианта, соблюдение видно в самом
      коде: проверка, тип, блокировка. Комментарий «здесь мы не пишем в журнал
      напрямую» соблюдением не является — соблюдение должно быть проверяемым
      без чтения комментария.
    weight: 2
    anchors:
      1: "Соблюдение заявлено только комментарием или именем переменной, в коде его нет"
      3: "Соблюдение есть, но хрупко: держится на соглашении вызова, которое ничем не проверяется, или на порядке строк"
      5: "Соблюдение обеспечено конструкцией: проверкой, типом или блокировкой, которую нельзя обойти, не тронув сам код защиты"
  - id: bypass_paths
    name: Нет обходного пути
    description: >
      Нет пути мимо защиты: legacy-ветка, отладочный флаг, административный
      режим, второй вход в то же хранилище. Обходной путь превращает инвариант
      в соглашение, которое соблюдают только в основном сценарии.
    weight: 1
    anchors:
      1: "Обходной путь есть и доступен в рабочем режиме: названы и ветка, и инвариант, который она снимает"
      3: "Обходной путь есть, но ограничен (флаг конфигурации, режим обслуживания) и не описан как исключение в решении"
      5: "Обходных путей нет: вход в защищённую область ровно один"
