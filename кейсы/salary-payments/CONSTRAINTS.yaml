# Реестр правил кейса: зарплатные и социальные выплаты в цифровых рублях
rules:
  - id: C-001
    name: spine_present
    type: file_exists
    path: "ARCHITECTURE-SPINE.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-002
    name: idempotency_key_in_code
    type: must_contain
    glob: "skeleton/**/*.py"
    pattern: 'idempotency_key'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-003
    name: no_pii_in_skeleton
    type: must_not_contain
    glob: "skeleton/**/*.py"
    pattern: 'snils'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-004
    name: reconciliation_in_code
    type: must_contain
    glob: "skeleton/**/*.py"
    pattern: 'reconcile'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-005
    name: append_only_journal_in_code
    type: must_contain
    glob: "skeleton/**/*.py"
    pattern: 'append_only'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-006
    name: limits_checked_before_send
    type: must_contain
    glob: "skeleton/**/*.py"
    pattern: 'check_limits'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-007
    name: partial_success_handled
    type: must_contain
    glob: "skeleton/**/*.py"
    pattern: 'partial'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-008
    name: spine_binds
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'Binds'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-009
    name: adr_alternatives
    type: each_file_must_contain
    glob: "docs/adr/ADR-*.md"
    pattern: 'Alternatives'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-010
    name: spec_present
    type: file_exists
    path: "docs/spec/salary-acceptance.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-011
    name: spec_ears
    type: must_contain
    glob: "docs/SPEC.md"
    pattern: 'shall'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-012
    name: reconciliation_report_present
    type: file_exists
    path: "docs/reconciliation.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-013
    name: skeleton_trace_present
    type: file_exists
    path: "docs/WALKING-SKELETON.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-014
    name: decision_a3_present
    type: file_exists
    path: "DECISION.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-015
    name: no_card_data_in_tests
    type: must_not_contain
    glob: "tests/**/*.py"
    pattern: 'PAN'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-016
    name: idempotency_key_enforced
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/idempotency-key/test_idempotency_key.py'
    timeout_secs: 120
    severity: error
    ad: AD-1
    rationale: 'инвариант идемпотентности проверяется исполнением: повторная доставка с тем же ключом не создаёт второй эффект'
    fix_hint: 'перенести проверку со скелета на настоящую точку входа: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-017
    name: append_only_journal_enforced
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/append-only-journal/test_append_only_journal.py'
    timeout_secs: 120
    severity: error
    ad: AD-2
    rationale: 'инвариант журнала проверяется исполнением: правка не меняет запись, удаления нет, исправление приходит отдельной компенсирующей записью'
    fix_hint: 'перенести проверку со скелета на настоящий журнал: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-018
    name: unknown_outcome_no_resend
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/unknown-outcome-no-resend/test_unknown_outcome_no_resend.py'
    timeout_secs: 120
    severity: error
    ad: AD-3
    rationale: 'неопределённый исход проверяется исполнением: повторная отправка при UNKNOWN запрещена, операция закрывается запросом статуса'
    fix_hint: 'перенести проверку со скелета на настоящую точку входа: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-019
    name: no_pii_in_logs
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/no-pii-in-logs/test_no_pii_in_logs.py'
    timeout_secs: 120
    severity: error
    ad: AD-4
    rationale: 'инвариант «персональные данные не покидают сценарий» проверяется исполнением: захваченная телеметрия сканируется регулярными выражениями форматов после прогона сценария'
    fix_hint: 'перенести проверку со скелета на настоящий сценарий: команда правила должна прогонять ваш сценарий и сканировать его телеметрию, а не эталонную реализацию из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-020
    name: validate_before_side_effect
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/validate-before-side-effect/test_validate_before_side_effect.py'
    timeout_secs: 120
    severity: error
    ad: AD-5
    rationale: 'инвариант «проверка раньше эффекта» проверяется исполнением: провал предусловия не оставляет за собой исполненное обращение и списанный лимит'
    fix_hint: 'перенести проверку со скелета на настоящую точку входа: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-021
    name: no_card_data_in_code
    type: must_not_contain
    glob: "**/*.py"
    pattern: 'PAN'
    severity: error
    ad: AD-4
    rationale: 'карточные данные не попадают ни в один python-источник кейса: C-015 закрывал только tests/, а нарушение в остальном коде (класс D11) уходило мимо реестра'
    fix_hint: 'убрать карточные данные из исходника; журналируются только идентификаторы операций (AD-4)'
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-022
    name: context_boundary_skeleton
    type: context_boundary
    glob: "skeleton/**/*.py"
    severity: error
    rationale: 'импорты между пакетами скелета обязаны следовать depends_on модели: обход границы контекста (импорт мимо объявленного ребра) — находка'
    fix_hint: 'либо удалите пересекающий импорт, либо оформите новую зависимость дельтой: depends_on в model/CMP-* и строка в DELTA.md'
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
