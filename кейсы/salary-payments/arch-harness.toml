# Конфиг контура кейса (читается, когда `arch-be` запускается ИЗ каталога кейса:
# `cd кейсы/salary-payments && arch-be gate --repo . --route critical`).
#
# Дрейф «модель ↔ код» — обязательная составляющая гейта (C1): у всех CMP
# проставлены code_roots на пакеты skeleton/ (дельта changes/code-roots),
# поэтому `model drift` кейса зелёный, а обход depends_on ловит правило
# C-022 (context_boundary). На сборке 0.3.14 составляющей `model_drift` в гейте
# ещё нет (волна C1) — запись вступит в силу после её слияния; неизвестная
# составляющая текущим бинарём игнорируется (проверено: гейт остаётся PASS).
[gate.required]
critical = ["model_drift"]
