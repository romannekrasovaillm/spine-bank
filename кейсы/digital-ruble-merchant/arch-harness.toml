# Конфиг контура кейса (читается, когда `arch-be` запускается ИЗ каталога кейса:
# `cd кейсы/digital-ruble-merchant && arch-be trust .`).
#
# Строгий режим ступени 3 метрики доверия (B3, ADR-065): «правила проверяют
# поведение» принимается только по ИЗМЕРЕНИЮ зубьев
# (`.arch-handoff/teeth.json`, пишет `arch-be rules teeth --save`), а каждый
# несущий инвариант (`load_bearing: true` в model/AD-*) обязан быть покрыт
# правилом с подтверждёнными зубьями.
[trust]
require_teeth = true
