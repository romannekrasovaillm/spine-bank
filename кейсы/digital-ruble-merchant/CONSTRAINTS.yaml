# Реестр правил кейса: приём оплаты цифровым рублём для ТСП
rules:
  - id: C-001
    name: spine_present
    type: file_exists
    path: "ARCHITECTURE-SPINE.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-002
    name: adr_alternatives
    type: each_file_must_contain
    glob: "docs/adr/ADR-*.md"
    pattern: 'Alternatives'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-003
    name: no_pan_in_tests
    type: must_not_contain
    glob: "tests/**/*.py"
    pattern: 'PAN'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-004
    name: spine_binds
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'Binds'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-005
    name: spec_present
