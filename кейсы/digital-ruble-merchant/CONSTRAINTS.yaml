# Реестр правил кейса: приём оплаты цифровым рублём для ТСП
rules:
  - id: C-001
    name: spine_present
    type: file_exists
    path: "ARCHITECTURE-SPINE.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-002
    name: adr_alternatives
    type: each_file_must_contain
    glob: "docs/adr/ADR-*.md"
    pattern: 'Alternatives'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-003
    name: no_pan_in_tests
    type: must_not_contain
    glob: "tests/**/*.py"
    pattern: 'PAN'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-004
    name: spine_binds
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'Binds'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-005
    name: spec_present
    type: file_exists
    path: "docs/spec/merchant-acceptance.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-006
    name: problem_present
    type: file_exists
    path: "docs/PROBLEM.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-007
    name: spec_ears
    type: must_contain
    glob: "docs/SPEC.md"
    pattern: 'shall'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-008
    name: no_todo_in_model
    type: must_not_contain
    glob: "model/**/*.md"
    pattern: 'TODO'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-009
    name: acceptance_present
    type: file_exists
    path: "docs/ACCEPTANCE.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-010
    name: openapi_present
    type: file_exists
    path: "docs/contracts/openapi-merchant.yaml"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-011
    name: spine_prevents
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'Prevents'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-012
    name: spine_rule
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'Rule'
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-013
    name: walking_skeleton_present
    type: file_exists
    path: "docs/WALKING-SKELETON.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
  - id: C-014
    name: idempotency_key_enforced
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/idempotency-key/test_idempotency_key.py'
    timeout_secs: 120
    severity: error
    ad: AD-1
    rationale: 'инвариант идемпотентности проверяется исполнением: повторная доставка с тем же ключом не создаёт второй эффект'
    fix_hint: 'перенести проверку со скелета на настоящую точку входа: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-015
    name: append_only_journal_enforced
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/append-only-journal/test_append_only_journal.py'
    timeout_secs: 120
    severity: error
    ad: AD-2
    rationale: 'инвариант журнала проверяется исполнением: правка не меняет запись, удаления нет, исправление приходит отдельной компенсирующей записью'
    fix_hint: 'перенести проверку со скелета на настоящий журнал: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-016
    name: unknown_outcome_no_resend
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/unknown-outcome-no-resend/test_unknown_outcome_no_resend.py'
    timeout_secs: 120
    severity: error
    ad: AD-3
    rationale: 'неопределённый исход проверяется исполнением: повторная отправка при UNKNOWN запрещена, операция закрывается запросом статуса'
    fix_hint: 'перенести проверку со скелета на настоящую точку входа: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-017
    name: no_pii_in_logs
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/no-pii-in-logs/test_no_pii_in_logs.py'
    timeout_secs: 120
    severity: error
    ad: AD-4
    rationale: 'инвариант «персональные данные не покидают сценарий» проверяется исполнением: захваченная телеметрия сканируется регулярными выражениями форматов после прогона сценария'
    fix_hint: 'перенести проверку со скелета на настоящий сценарий: команда правила должна прогонять ваш сценарий и сканировать его телеметрию, а не эталонную реализацию из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-018
    name: validate_before_side_effect
    type: command_succeeds
    command: 'python3 -m pytest -q -p no:cacheprovider skeleton/rule_templates/validate-before-side-effect/test_validate_before_side_effect.py'
    timeout_secs: 120
    severity: error
    ad: AD-6
    rationale: 'инвариант «проверка раньше эффекта» проверяется исполнением: провал предусловия не оставляет за собой исполненное обращение и списанный лимит'
    fix_hint: 'перенести проверку со скелета на настоящую точку входа: команда правила должна прогонять тесты вашего кода, а не эталонной реализации из шаблона'
    skill: fitness-functions
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 2
  - id: C-019
    name: no_card_data_in_code
    type: must_not_contain
    glob: "**/*.py"
    pattern: 'PAN'
    severity: error
    ad: AD-4
    rationale: 'карточные данные не попадают ни в один python-источник кейса: C-003 закрывал только tests/, а нарушение в остальном коде (класс D11) уходило мимо реестра'
    fix_hint: 'убрать карточные данные из исходника; журналируются только идентификаторы операций (AD-4)'
    owner: OWNER-001
    expiry: 2027-12-31
    effort_hours: 1
