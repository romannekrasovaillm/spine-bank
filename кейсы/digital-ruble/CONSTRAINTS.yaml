# Fitness-правила для `arch control check` (схема control::check).
# Этап: решение и спецификация (до кода). Правила проверяют артефакты
# решения — инварианты спайна, контракты, измеримость NFR — и служат
# звеном `AD → правило` для `arch trace check`.
# Поле `id` — ссылка из модели (`verified_by: [C-00N]`); `name` — код находки.
# Карточка правила: owner — владелец (сущность модели), expiry — срок
# пересмотра, effort_hours — стоимость сопровождения правила.
rules:
  - id: C-001
    name: istina-na-platforme-cr
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'единственный источник истины'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-002
    name: zhurnal-append-only
    type: must_contain
    glob: "docs/adr/ADR-003-*.md"
    pattern: 'append-only'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-003
    name: idempotency-key-v-kontrakte-kanalov
    type: must_contain
    glob: "docs/contracts/client-api.md"
    pattern: 'Idempotency-Key'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 2

  - id: C-004
    name: kontrakt-adapttera-pcr
    type: file_exists
    path: "docs/contracts/pcr-platform-adapter.md"
    severity: error
    owner: OWNER-002
    expiry: 2027-06-30
    effort_hours: 2

  - id: C-005
    name: sostoyanie-unknown-v-mashine
    type: must_contain
    glob: "docs/spec/operation-state-machine.md"
    pattern: 'UNKNOWN'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 3

  - id: C-006
    name: degradaciya-bez-tenevogo-ispolneniya
    type: must_contain
    glob: "docs/adr/ADR-006-*.md"
    pattern: 'деградац'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 2

  - id: C-007
    name: sverka-s-izmerimym-lagom
    type: must_contain
    glob: "docs/adr/ADR-007-*.md"
    pattern: 'лаг сверки'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 2

  - id: C-008
    name: kriptograficheskaya-granica
    type: must_contain
    glob: "docs/adr/ADR-008-*.md"
    pattern: 'СКЗИ|ГОСТ TLS|mTLS'
    severity: error
    owner: OWNER-002
    expiry: 2027-06-30
    effort_hours: 3

  - id: C-009
    name: dva-faktora-i-antifrod
    type: must_contain
    glob: "docs/spec/limits-and-antifraud.md"
    pattern: '2FA'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 3

  - id: C-010
    name: razgranichenie-otvetstvennosti
    type: must_contain
    glob: "docs/solutioning.md"
    pattern: '(?i)разграничение ответственности'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-011
    name: nfr-katalog-sushchestvuet
    type: file_exists
    path: "docs/nfr.md"
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-012
    name: adr-bez-sluzhebnyh-kommentariev
    type: must_not_contain
    glob: "docs/adr/*.md"
    pattern: '<!--'
    severity: error
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-013
    name: nfr-izmerimy-ciframi
    type: must_contain
    glob: "docs/nfr.md"
    pattern: 'p99'
    severity: warn
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-014
    name: spine-bez-zaglushek
    type: must_not_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: 'TODO|TBD|FIXME|XXX'
    severity: warn
    owner: OWNER-001
    expiry: 2027-06-30
    effort_hours: 1

  - id: C-015
    name: kontrakty-vseh-integraciy
    type: file_exists
    path: "docs/contracts/antifraud-api.md"
    severity: error
    owner: OWNER-002
    expiry: 2027-06-30
    effort_hours: 2
