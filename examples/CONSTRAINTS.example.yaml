# CONSTRAINTS.example.yaml — компактный пример реестра fitness-функций для
# `arch-be control check`. Файл разложен `arch-be init` в `~/.arch-harness/
# examples/` как эталон формата (установленный контур, без захода в исходники
# spine-bank).
#
# Правила подобраны безобидными на пустом дереве: либо проверяют ТОЛЬКО
# найденные файлы (`must_not_contain` на пустом наборе находок не даёт), либо
# объявляют применимость через `applies_to` и на чужом/пустом репозитории
# получают статус N/A, а не ложную находку «правилу нечего проверять».
#
# Схема (src/control/types.rs, FitnessRule): обязательны `name` и `type`;
# остальные поля опциональны. Тип: must_contain | must_not_contain |
# each_file_must_contain | file_exists | dir_must_have_file | max_age |
# command_succeeds | dependency_direction | context_boundary. Common-поля:
#   glob: "src/**/*.rs"   # набор файлов — строка или список; `**` — любая
#                         # глубина, `{a,b}` — альтернативы: "svc/{api,web}/**"
#   pattern: "<regex>"    # must_contain/must_not_contain/each_file_must_contain
#   exclude_glob: "..."   # вычитание легитимных отступлений из набора
#   severity: error|warn  # дефолт error; error ломает гейт (exit 1), warn — нет
#   owner: <кто>          # карточка правила: владелец
#   expiry: "YYYY-MM-DD"  # просроченное правило — warn-находка
#   applies_to: {stack:[rust], when_exists:[Cargo.toml], when_glob_nonempty:true}
# Больше примеров и семантики наборов — `docs/control.md`.
rules:
  # must_not_contain — «запрещённый паттерн не встречается». Безопасен на любом
  # дереве: пустой набор файлов находок не даёт.
  - name: no_direct_db_from_api_layer
    type: must_not_contain
    glob: "services/api/**/*.rs"
    pattern: "sqlx::|diesel::|rusqlite::"
    severity: error
    owner: platform-arch
    expiry: "2027-12-31"
    rationale: "AD-1 слоистости: API ходит в БД только через доменный слой"
    fix_hint: "вынести запрос в доменный репозиторий"

  # each_file_must_contain — «паттерн есть в КАЖДОМ файле набора».
  # applies_to.when_glob_nonempty: пустой набор — N/A, а не находка «правилу
  # нечего проверять» — правило применимо только там, где такие конфиги есть.
  - name: every_client_config_has_timeout
    type: each_file_must_contain
    glob: "services/*/config/*.yaml"
    pattern: "timeout"
    severity: error
    applies_to:
      when_glob_nonempty: true
    owner: platform-arch
    expiry: "2027-12-31"
    rationale: "«Каждый исходящий вызов имеет таймаут» (Release It!)"

  # dir_must_have_file — в КАЖДОМ каталоге набора есть файл `path`.
  - name: every_service_has_openapi_contract
    type: dir_must_have_file
    glob: "services/*"
    path: "openapi.yaml"
    severity: error
    applies_to:
      when_glob_nonempty: true
    owner: api-guild
    expiry: "2027-12-31"
    rationale: "«Синхронный интерфейс имеет машиночитаемый контракт»"

  # dependency_direction — направление импортов (ровно одно из forbid/allow).
  # allow — fail-closed whitelist: новая зависимость ломает сборку.
  - name: api_layer_allowed_imports
    type: dependency_direction
    glob: "services/api/**/*.rs"
    allow: ["domain", "config", "error"]
    severity: error
    applies_to:
      when_glob_nonempty: true
    owner: platform-arch
    expiry: "2027-12-31"
    rationale: "API не импортирует инфраструктуру БД и UI"

  # file_exists — обязательный файл. when_exists делает правило применимым
  # только в репозитории с документацией (иначе N/A, а не warn-находка).
  - name: spine_present
    type: file_exists
    path: "docs/ARCHITECTURE-SPINE.md"
    severity: warn
    applies_to:
      when_exists: ["docs/**/*.md"]
    owner: architecture-office
    expiry: "2027-12-31"
    rationale: "позвоночник инвариантов нужен для Standard/Critical маршрутов"

  # must_not_contain уровня warn: заглушки в документах видны, но гейт не
  # ломают (severity-нюанс: error → exit 1, warn → только строка отчёта).
  - name: no_placeholder_markers
    type: must_not_contain
    glob: "docs/**/*.md"
    pattern: "TODO|TBD|FIXME"
    severity: warn
    owner: documentation-guild
    expiry: "2027-12-31"
    rationale: "неготовое решение оформляется в Deferred, а не TODO"

  # command_succeeds — прогон команды. severity: warn — падение даёт
  # предупреждение, а не exit 1. when_exists запускает правило только в
  # Rust-репозитории (Cargo.toml), на пустом дереве — N/A.
  - name: unit_tests_pass
    type: command_succeeds
    command: "cargo test --quiet"
    timeout_secs: 900
    severity: warn
    applies_to:
      when_exists: ["Cargo.toml"]
    owner: ci-owner
    expiry: "2027-12-31"
    rationale: "conformance evidence: юнит-тесты обязаны проходить"

# --- Исключения из правил (override) ---
# Override отключает правило ЦЕЛИКОМ. Обязательны три поля rule+adr+until;
# ссылка обязана вести на ПРИНЯТЫЙ ADR (Status: Accepted) в пределах горизонта,
# иначе — error (ослабление не узаконено).
#
# Узкое исключение (не гасить правило целиком, а только на части файлов) —
# необязательное поле `exclude_glob` (0.4.8+): правило перестаёт срабатывать
# лишь на перечисленных путях, вне их действует как обычно. Пример
# (раскомментируйте, подставив существующий принятый ADR):
# overrides:
#   - rule: no_direct_db_from_api_layer
#     adr: ADR-042
#     until: 2027-06-30
#     exclude_glob: ["services/api/legacy/**"]
