# CONSTRAINTS.java-services.yaml — стандарт «Java-сервисы» (приложение C задачи).
#
# 12 требований S1–S12, зафиксированных в `TASK-Spine-0.4.0-architect-value.md`
# §C.1. Задача P1 — механизовать их ровно настолько, насколько это позволяют
# типы правил, и ЗАФИКСИРОВАТЬ долю выразимых (метрика 7 таблицы §9).
#
# Исходный замер на 0.3.17 — 7 из 12 (исполняемая проверка у S1, S3, S4, S6, S7,
# S8, S11). Волна S (0.4.0, ADR-070) добавила механику S2 (`deny_dependency`
# со scopes/диапазоном версий), S5 (`conditional`), S10 (`outbound_allowlist`),
# S12 (`must_not_contain` + `multiline`) — итог 11/12. Осталось S9
# (`data_ownership`, требует графа R3) — осознанный `unverifiable: true` с
# владельцем `@dka-data`.
#
# Схема — src/control/types.rs (FitnessRule). Типы: must_contain,
# must_not_contain, each_file_must_contain, file_exists, dir_must_have_file,
# max_age, command_succeeds, dependency_direction, context_boundary, archunit,
# deny_dependency, conditional, outbound_allowlist. Шаблонные карточки
# (owner/rationale/reference/expiry) движок переносит в находки и читает обход
# `change_impact`.
version: "2026.10"
id: JAVA-SERVICES
rules:
  # S1. Встраиваемые СУБД (h2, hsqldb) не в runtime прода.
  # Выразимо × deny_dependency (волна S, ADR-070): тех-радар разбирает Maven и
  # Gradle (Groovy/KTS), а `scopes: [runtime, compile]` отсекает тестовые
  # зависимости (`testImplementation`, `<scope>test</scope>`).
  - id: JSS-001
    name: s1_no_embedded_db_in_prod
    type: deny_dependency
    manifests: ["**/pom.xml", "**/build.gradle", "**/build.gradle.kts"]
    deny:
      - { name: "com.h2database:h2", scopes: [runtime, compile] }
      - { name: hsqldb, scopes: [runtime, compile] }
    severity: warn
    owner: "@arch-board"
    rationale: "Тех-радар Hold: встраиваемые СУБД (h2, hsqldb) недопустимы в runtime прода."
    reference: "TECH-RADAR hold-embedded-db"

  # S2. log4j-core < 2.17.1 запрещён. Выразимо × deny_dependency с диапазоном
  # версии (`below: "2.17.1"`, волна S, ADR-070): сравнение по точечно-числовым
  # версиям Maven/Gradle; нечисловые специф. (диапазоны `[1.0,2.0)`) — fail-open.
  - id: JSS-002
    name: s2_log4j_min_version
    type: deny_dependency
    manifests: ["**/pom.xml", "**/build.gradle", "**/build.gradle.kts"]
    deny:
      - { name: log4j-core, below: "2.17.1" }
    severity: error
    owner: "@dka-security"
    rationale: "log4j-core < 2.17.1 запрещён (Log4Shell); ниже порога — error."
    reference: "TECH-RADAR log4j-2.17.1"

  # S3. Каждый бизнес-сервис публикует OpenAPI. Выразимо хрупким glob'ом ×
  # dir_must_have_file (признак сервиса — каталог `src/main/resources`).
  - id: JSS-003
    name: s3_openapi_per_service
    type: dir_must_have_file
    glob: "**/src/main/resources"
    path: "openapi.yaml"
    severity: warn
    owner: "@arch-board"
    rationale: "Каждый сервис публикует машиночитаемый контракт OpenAPI."
    reference: "AD-API-CONTRACT"

  # S4. actuator в каждом сервисе. Выразимо × each_file_must_contain по манифесту
  # сборки; корневой манифест-агрегатор исключается (он не сервис).
  - id: JSS-004
    name: s4_actuator_per_service
    type: each_file_must_contain
    glob: ["**/pom.xml", "**/build.gradle", "**/build.gradle.kts"]
    exclude_glob: ["pom.xml", "build.gradle", "build.gradle.kts"]
    pattern: "spring-boot-starter-actuator"
    severity: warn
    owner: "@sre"
    rationale: "Каждый сервис отдаёт health/metrics через actuator."

  # S5. Исходящие вызовы — только через circuit breaker. Выразимо × conditional
  # (волна S, ADR-070): триггер `if` — сетевой вызов клиента в модуле сборки,
  # обязательство `then` — circuit breaker в том же модуле. Модуль без breaker
  # при наличии исходящего клиента — находка.
  - id: JSS-005
    name: s5_outbound_circuit_breaker
    type: conditional
    if:
      glob: ["**/*.java"]
      pattern: "(?:RestTemplate|WebClient|FeignClient|HttpClient|OkHttpClient)"
    then:
      glob: ["**/*.java"]
      pattern: "(?:@CircuitBreaker|@HystrixCommand|@Bulkhead|resilience4j)"
    severity: warn
    owner: "@arch-board"
    rationale: "Исходящие вызовы идут только через circuit breaker (AD-RESILIENCE)."
    reference: "AD-RESILIENCE"

  # S6. Домен не зависит от адаптеров и фреймворка. Выразимо ×
  # dependency_direction (B4 нормализует и слэш-, и точечную нотацию для *.java);
  # текстовая проверка импортов слепа к FQN-обращениям без import (V02/V11) и
  # к wildcard-импорту — это ловит только ArchUnit-мост (C.3).
  - id: JSS-006
    name: s6_domain_independent
    type: dependency_direction
    glob: "**/application/domain/**/*.java"
    forbid:
      - "io/reflectoring/buckpal/adapter"
      - "org/springframework"
      - "jakarta/persistence"
      - "javax/persistence"
    # Гексагональная раскладка пакетов (`application.domain`) — не универсальна.
    # На репозитории без такого слоя правило неприменимо: пустой набор файлов
    # должен дать N/A, а не ERROR (метрика 9, §S1). `stack` дополнительно
    # ограничивает корп-правило Java-сборкой.
    applies_to:
      stack: [java-maven, java-gradle]
      when_glob_nonempty: true
    severity: error
    owner: "@arch-board"
    rationale: "Домен не зависит от адаптеров и фреймворка (AD-LAYER-DOMAIN, hexagonal)."
    reference: "AD-LAYER-DOMAIN"

  # S7. Входящий адаптер не обращается к исходящему напрямую (только через порт).
  - id: JSS-007
    name: s7_inbound_no_outbound
    type: dependency_direction
    glob: "**/adapter/in/**/*.java"
    forbid:
      - "io/reflectoring/buckpal/adapter/out"
    # Слой `adapter.in` специфичен для гексагональной раскладки buckpal; на
    # сервисе без него глоб пуст → N/A (метрика 9, §S1).
    applies_to:
      stack: [java-maven, java-gradle]
      when_glob_nonempty: true
    severity: error
    owner: "@arch-board"
    rationale: "Входящий адаптер не зависит от исходящего (AD-LAYER-PORTS)."
    reference: "AD-LAYER-PORTS"

  # S8. Нет паролей литералом в конфиге. Выразимо × must_not_contain построчно;
  # проверка слепа к многострочным и нестандартным формам (волна S — scope).
  - id: JSS-008
    name: s8_no_literal_password
    type: must_not_contain
    glob: ["**/application*.yml", "**/application*.yaml"]
    pattern: "^\\s*password\\s*:\\s*['\"]?[A-Za-z0-9_]"
    severity: warn
    owner: "@dka-security"
    rationale: "Пароли не хранятся литералом в конфиге — только из секрет-хранилища."

  # S9. database-per-service. Выразимо × data_ownership (волна S, S9,
  # ADR-078): хранилища из графа as-built (ADR-069, `store:`-узлы и рёбра
  # `connect`) читают/пишут только компоненты-владельцы. Без `owners` —
  # режим database-per-service: у хранилища не более одного коннектора.
  - id: JSS-009
    name: s9_database_per_service
    type: data_ownership
    severity: warn
    owner: "@dka-data"
    rationale: "Database-per-service — хранилище читает/пишет только компонент-владелец."
    reference: "ADR-069"

  # S10. Исходящие хосты — только из реестра интеграций. Выразимо ×
  # outbound_allowlist (волна S, ADR-070): URL-литералы из кода и конфигов
  # сверяются с домен-реестром `allow` (INT-реестр, вынесенный в правило).
  - id: JSS-010
    name: s10_hosts_from_registry
    type: outbound_allowlist
    glob: ["**/*.java", "**/*.yml", "**/*.yaml", "**/*.properties"]
    allow:
      - api.bank.example
      - sso.bank.example
      - registry.bank.example
    severity: warn
    owner: "@arch-board"
    rationale: "Исходящие хосты — только из реестра интеграций (INT-*)."
    reference: "AD-INT-REGISTRY"

  # S11. Java 17+. Выразимо хрупким regex по манифесту сборки (pom/gradle);
  # произвольные формы версии не покрываются.
  - id: JSS-011
    name: s11_java_17_plus
    type: must_contain
    glob: ["**/pom.xml", "**/build.gradle", "**/build.gradle.kts"]
    pattern: "(?i)(<java\\.version>\\s*(?:1[7-9]|2[0-9])|VERSION_(?:17|21)|sourceCompatibility\\s*=\\s*['\"]?(?:1[7-9]|2[0-9]))"
    severity: warn
    owner: "@arch-board"
    rationale: "Сборка на Java 17+."

  # S12. Нет field injection (@Autowired на поле). Выразимо × must_not_contain
  # + `multiline: true` (волна S, ADR-070): regex применяется к содержимому
  # целиком и ловит аннотацию на отдельной строке над полем; параметр
  # конструктора не ловится (нет `private`/`protected`).
  - id: JSS-012
    name: s12_no_field_injection
    type: must_not_contain
    glob: ["**/*.java"]
    multiline: true
    pattern: "@(?:Autowired|Inject|Resource)\\s+(?:private|protected)\\s+[\\w.<>\\[\\],]+\\s+\\w+\\s*;"
    severity: warn
    owner: "@arch-board"
    rationale: "Нет field injection: @Autowired/@Inject/@Resource только через конструктор."
    reference: "AD-DI-CONSTRUCTOR"
