# repos.lock — приложения B (чужие репо), пиннутые SHA.
# Формат: <url>  <sha>  <local-mirror>
# local-mirror — путь клонов по умолчанию (~/bench-repos); прогонщики берут
# корень клонов из --repos-dir / ARCH_VALUE_REPOS, домашний путь не зашит.
# Клоны в git не входят; на них не влияет заморозка входов P1.
#
# Boutique (online-boutique): 12 компонентов, 17 межсервисных рёбер, 1 хранилище.
#   rёбра — из kubernetes-manifests/*.yaml (env *_ADDR) + kustomize/components/shopping-assistant.
# PetClinic (microservices): 8 maven-модулей, 6 бизнес-рёбер, 3 СУБД, OpenAI/Azure.
#   рёбра — api-gateway/application.yml (lb://) + genai-service (VectorStoreController, AIDataProvider).
# buckpal (гексагон, Gradle): пакетный уровень, эталон — DependencyRuleTests.java (ArchUnit).
# library (DDD, Maven): контексты lending / catalogue / commons.

